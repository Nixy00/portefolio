    <script>
      // Applique le thème et la langue avant l'affichage, pour éviter un flash.
      (function () {
        var d = document.documentElement, th, lg;
        try { th = localStorage.getItem("portfolio-theme"); lg = localStorage.getItem("portfolio-lang"); } catch (e) {}
        if (th !== "dark" && th !== "light") th = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (lg !== "fr" && lg !== "en") lg = (navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
        d.dataset.theme = th;
        d.lang = lg;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
